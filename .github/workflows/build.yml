# Compila MBStudio91 MuMU su GitHub a ogni aggiornamento del ramo main:
#  - Mac: VST3 + AU + app, binario universale (Apple Silicon e Intel), firma ad hoc, controllo con pluginval
#  - Windows: VST3 + app (x64)
# I file pronti vengono pubblicati nella pagina "Releases" del repository: non serve scaricare i sorgenti.
name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: macOS universale
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Compila
        run: cmake --build build --config Release --target MBStudio91MuMU_VST3 MBStudio91MuMU_AU MBStudio91MuMU_Standalone -- -quiet
      - name: Firma ad hoc e comprimi
        run: |
          cd "build/MBStudio91MuMU_artefacts/Release"
          codesign --force --deep -s - "VST3/MBStudio91 MuMU.vst3"
          codesign --force --deep -s - "AU/MBStudio91 MuMU.component"
          codesign --force --deep -s - "Standalone/MBStudio91 MuMU.app"
          ditto -c -k --keepParent "VST3/MBStudio91 MuMU.vst3"      "MuMU-VST3-mac.zip"
          ditto -c -k --keepParent "AU/MBStudio91 MuMU.component"   "MuMU-AU-mac.zip"
          ditto -c -k --keepParent "Standalone/MBStudio91 MuMU.app" "MuMU-App-mac.zip"
      - name: Controllo con pluginval
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pv.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --skip-gui-tests "build/MBStudio91MuMU_artefacts/Release/VST3/MBStudio91 MuMU.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/MBStudio91MuMU_artefacts/Release/*.zip

  tests:
    name: Prove del sequencer (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Librerie
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libfreetype-dev libfontconfig1-dev ninja-build
      - name: Configura
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMUMU_BUILD_TESTS=ON
      - name: Compila
        run: cmake --build build --target mumu_seqtest
      - name: Esegui
        run: ./build/mumu_seqtest_artefacts/Release/mumu_seqtest

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        run: cmake -S . -B build -A x64
      - name: Compila
        run: cmake --build build --config Release --target MBStudio91MuMU_VST3 MBStudio91MuMU_Standalone
      - name: Comprimi
        shell: pwsh
        run: |
          $r = "build/MBStudio91MuMU_artefacts/Release"
          Compress-Archive -Path "$r/VST3/MBStudio91 MuMU.vst3" -DestinationPath "MuMU-VST3-win.zip"
          Compress-Archive -Path "$r/Standalone/MBStudio91 MuMU.exe" -DestinationPath "MuMU-App-win.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  release:
    name: Pubblica in Releases
    if: github.ref == 'refs/heads/main'
    needs: [mac, windows, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: MBStudio91 MuMU 0.1.${{ github.run_number }}
          body: |
            Compilato automaticamente da GitHub dal commit ${{ github.sha }}.

            **Mac** (Apple Silicon e Intel, macOS 11 o successivo)
            - MuMU-VST3-mac.zip: estrai e copia in ~/Library/Audio/Plug-Ins/VST3/
            - MuMU-AU-mac.zip: estrai e copia in ~/Library/Audio/Plug-Ins/Components/
            - MuMU-App-mac.zip: versione autonoma, va in Applicazioni
            Il plugin non è firmato da Apple: dopo averlo copiato, nel Terminale
            `xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"MBStudio91 MuMU.vst3" ~/Library/Audio/Plug-Ins/Components/"MBStudio91 MuMU.component" /Applications/"MBStudio91 MuMU.app"`

            **Windows** (64 bit)
            - MuMU-VST3-win.zip: estrai e copia la cartella "MBStudio91 MuMU.vst3" in C:\Program Files\Common Files\VST3\
            - MuMU-App-win.zip: versione autonoma (MBStudio91 MuMU.exe)
          files: dist/*.zip
